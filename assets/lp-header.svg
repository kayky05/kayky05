<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <style>
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; }
    .body { font-family: 'Segoe UI', Ubuntu, -apple-system, sans-serif; }

    .cursor { animation: blink 1.1s step-end infinite; fill: #7c5cff; }
    @keyframes blink { 50% { opacity: 0; } }

    .scan { animation: scan 4s ease-in-out infinite; }
    @keyframes scan {
      0%   { transform: translateY(0); opacity: 0; }
      8%   { opacity: .9; }
      50%  { transform: translateY(150px); opacity: .9; }
      92%  { opacity: 0; }
      100% { transform: translateY(150px); opacity: 0; }
    }

    .chip { animation: float 6s ease-in-out infinite; }
    .chip.c2 { animation-delay: 1.3s; }
    .chip.c3 { animation-delay: 2.6s; }
    .chip.c4 { animation-delay: 3.9s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); opacity: .55; }
      50% { transform: translateY(-8px); opacity: 1; }
    }

    .dot { animation: pulse 3s ease-in-out infinite; }
    .dot.d2 { animation-delay: .5s; }
    .dot.d3 { animation-delay: 1s; }
    @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }

    .glow { animation: breathe 6s ease-in-out infinite; transform-origin: 765px 70px; }
    @keyframes breathe {
      0%, 100% { opacity: .25; }
      50% { opacity: .5; }
    }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10121a"/>
      <stop offset="1" stop-color="#0b0c12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#19c7c7"/>
    </linearGradient>
    <radialGradient id="radial" cx="765" cy="70" r="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="browserClip">
      <rect x="520" y="60" width="330" height="190" rx="10"/>
    </clipPath>
  </defs>

  <rect width="900" height="300" fill="url(#bg)"/>
  <circle class="glow" cx="765" cy="70" r="140" fill="url(#radial)"/>

  <!-- título -->
  <text class="body" x="48" y="98" font-size="34" font-weight="700" fill="#f2f2f5" letter-spacing="1">Landing pages com IA</text>
  <rect x="48" y="112" width="230" height="4" rx="2" fill="url(#accent)"/>
  <text class="mono" x="48" y="146" font-size="16" fill="#9aa4b2">React 19 · Vite · TypeScript · Tailwind v4</text>
  <text class="mono" x="48" y="172" font-size="15" fill="#6d7686">Deploy: Cloudflare Pages + R2 · Hostinger</text>

  <!-- linha digitando -->
  <text class="mono" x="48" y="214" font-size="17" fill="#c9d1d9">&lt;LandingPage conversao<tspan fill="#19c7c7">="alta"</tspan> /&gt;<tspan class="cursor" x="330" y="214">▌</tspan></text>

  <!-- chips flutuantes -->
  <g class="mono" font-size="12" font-weight="600">
    <g class="chip c1">
      <rect x="48" y="238" width="104" height="26" rx="13" fill="#161a24" stroke="#2a3242"/>
      <text x="100" y="255" text-anchor="middle" fill="#c9b8ff">React Bits</text>
    </g>
    <g class="chip c2">
      <rect x="162" y="238" width="88" height="26" rx="13" fill="#161a24" stroke="#2a3242"/>
      <text x="206" y="255" text-anchor="middle" fill="#8fe3e3">21st.dev</text>
    </g>
    <g class="chip c3">
      <rect x="260" y="238" width="96" height="26" rx="13" fill="#161a24" stroke="#2a3242"/>
      <text x="308" y="255" text-anchor="middle" fill="#c9b8ff">shadcn/ui</text>
    </g>
    <g class="chip c4">
      <rect x="366" y="238" width="140" height="26" rx="13" fill="#161a24" stroke="#2a3242"/>
      <text x="436" y="255" text-anchor="middle" fill="#8fe3e3">IA / Higgsfield</text>
    </g>
  </g>

  <!-- mockup de browser -->
  <g>
    <rect x="520" y="60" width="330" height="190" rx="10" fill="#12141c" stroke="#2a3242" stroke-width="1.5"/>
    <rect x="520" y="60" width="330" height="26" rx="10" fill="#161a24"/>
    <circle class="dot d1" cx="536" cy="73" r="4" fill="#ff5f56"/>
    <circle class="dot d2" cx="550" cy="73" r="4" fill="#ffbd2e"/>
    <circle class="dot d3" cx="564" cy="73" r="4" fill="#27c93f"/>
    <rect x="590" y="68" width="220" height="10" rx="5" fill="#1d2029"/>

    <g clip-path="url(#browserClip)">
      <rect x="536" y="100" width="150" height="16" rx="4" fill="#202430"/>
      <rect x="536" y="126" width="298" height="60" rx="8" fill="#171b26"/>
      <rect x="536" y="196" width="140" height="10" rx="5" fill="#202430"/>
      <rect x="536" y="214" width="190" height="10" rx="5" fill="#1a1d27"/>
      <rect x="690" y="196" width="80" height="26" rx="6" fill="url(#accent)" opacity=".85"/>
      <rect class="scan" x="520" y="0" width="330" height="2" fill="url(#accent)" opacity="0"/>
    </g>
  </g>

  <text class="mono" x="520" y="276" font-size="12" fill="#4d5564">github.com/kayky05</text>
</svg>
